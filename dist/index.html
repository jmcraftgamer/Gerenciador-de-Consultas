<!DOCTYPE html>
<html>
<head>
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="BemEstar - Gerenciamento de consultas para psicanalistas">
  <meta name="theme-color" content="#B8A88A">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="BemEstar">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>BemEstar - Psicanalista</title>

  <style>
    body {
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #F3EEE7;
    }
    flt-glass-pane {
      max-width: 430px !important;
      width: 100vw !important;
      max-height: 100vh !important;
      height: 100vh !important;
      border-radius: 24px !important;
      overflow: hidden !important;
      box-shadow: 0 0 60px rgba(0,0,0,0.1) !important;
    }
    @media (max-width: 430px) {
      flt-glass-pane {
        border-radius: 0 !important;
        max-width: 100vw !important;
      }
    }
    /* Loading indicator */
    .loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: 'Inter', sans-serif;
      color: #8A7D6B;
    }
    .loading img {
      width: 80px;
      height: 80px;
      margin-bottom: 16px;
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.05); opacity: 0.8; }
    }
  </style>
</head>
<body>
  <div class="loading" id="loading">
    <img src="favicon.png" alt="BemEstar">
    <p>Carregando...</p>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function() {
      var el = document.getElementById('loading');
      if (el) el.style.display = 'none';
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
